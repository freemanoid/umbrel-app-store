version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: freemanoid-tg-torrent-bot_bot_1
      APP_PORT: 8542
    container_name: freemanoid-tg-torrent-bot_app_proxy_1
  bot:
    image: ghcr.io/freemanoid/tg-torrent-bot:1.11.0@sha256:c02a2c1e5860fca9f930c2cd7d766b673b6cb502c4c2de1ae5a4d7703de9a71b
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    container_name: freemanoid-tg-torrent-bot_bot_1
