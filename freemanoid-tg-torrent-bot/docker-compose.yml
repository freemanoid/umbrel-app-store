version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: freemanoid-tg-torrent-bot_bot_1
      APP_PORT: 8542
    container_name: freemanoid-tg-torrent-bot_app_proxy_1
  bot:
    image: ghcr.io/freemanoid/tg-torrent-bot:1.7.0@sha256:dfc59179016ec4d4c2d9e3f4a2509b5f7d082f18c7f72fb508c638d5bd13b435
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    container_name: freemanoid-tg-torrent-bot_bot_1
