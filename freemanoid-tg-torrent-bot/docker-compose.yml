version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: freemanoid-tg-torrent-bot_bot_1
      APP_PORT: 8542
    container_name: freemanoid-tg-torrent-bot_app_proxy_1
  bot:
    image: ghcr.io/freemanoid/tg-torrent-bot:1.1.0@sha256:dbd10455476769e5e87d0efbec420a771f1cd73cf017fac2d8ea01cf745baee2
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    container_name: freemanoid-tg-torrent-bot_bot_1
