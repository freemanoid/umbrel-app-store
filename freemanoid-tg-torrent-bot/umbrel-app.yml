manifestVersion: 1
id: freemanoid-tg-torrent-bot
name: TG Torrent Bot
tagline: Search and download torrents from Telegram via Prowlarr and Transmission
icon: https://raw.githubusercontent.com/freemanoid/umbrel-app-store/master/freemanoid-tg-torrent-bot/icon.svg
category: media
version: "1.6.0"
port: 8542
description: >-
  Telegram bot for torrent automation. Send any text to search your Prowlarr
  indexers, pick a release from an inline keyboard, and it is added to
  Transmission with a completion notification. Subscription mode
  (/sub query | filters) auto-downloads new releases matching your filters
  (resolution, codecs, audio, size).

  Headless app: all interaction happens in Telegram. Requires a .env file in the
  app's data directory (Telegram token, allowed chat id, Prowlarr and
  Transmission URLs) — see the repo README.
developer: tg-torrent-bot
website: ""
submitter: tg-torrent-bot
submission: https://github.com/freemanoid/umbrel-app-store
repo: ""
support: https://github.com/freemanoid/umbrel-app-store/issues
gallery: []
releaseNotes: "Generic help examples; image linked to public source repo."
dependencies:
  - transmission
  - prowlarr
path: ""
defaultUsername: ""
defaultPassword: ""
